<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Portal - Fast Payment</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #1e293b; padding: 20px; border-radius: 12px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 5px; font-size: 22px; }
        .subtitle { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        .plan-card { background: #334155; padding: 15px; border-radius: 8px; margin-top: 12px; border: 1px solid #475569; display: flex; justify-content: space-between; align-items: center; }
        .plan-info h4 { margin: 0; font-size: 15px; color: #f8fafc; }
        .plan-info p { margin: 3px 0 0 0; font-size: 13px; color: #38bdf8; font-weight: bold; }
        .pay-btn { background: #10b981; color: #fff; padding: 8px 14px; border-radius: 6px; border: none; font-weight: bold; font-size: 13px; cursor: pointer; transition: background 0.2s; text-decoration: none; }
        .pay-btn:hover { background: #059669; }
        .support-container { margin-top: 25px; text-align: center; border-top: 1px solid #334155; padding-top: 15px; }
        .support-btn { background: #0ea5e9; color: #fff; padding: 10px 15px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block;}
    </style>
</head>
<body>
    <div class="container">
        <h2>👑 VIP Portal</h2>
        <div class="subtitle">Select your plan and pay directly via GPay, PhonePe, Paytm</div>

        <div class="plan-card">
            <div class="plan-info"><h4>1 Days Pass</h4><p>₹5</p></div>
            <button class="pay-btn" onclick="payNow('1 Days Pass', 5)">Pay Now ₹5</button>
        </div>
        <div class="plan-card">
            <div class="plan-info"><h4>1 Month Pass</h4><p>₹199</p></div>
            <button class="pay-btn" onclick="payNow('1 Month Pass', 199)">Pay Now ₹199</button>
        </div>
        <div class="plan-card">
            <div class="plan-info"><h4>2 Months Pass</h4><p>₹369</p></div>
            <button class="pay-btn" onclick="payNow('2 Months Pass', 369)">Pay Now ₹369</button>
        </div>
        <div class="plan-card">
            <div class="plan-info"><h4>3 Months Gold</h4><p>₹499</p></div>
            <button class="pay-btn" onclick="payNow('3 Months Gold', 499)">Pay Now ₹499</button>
        </div>

        <div class="support-container">
            <a href="https://t.me/botmaster55" class="support-btn" target="_blank">📞 Contact Support</a>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚠️ YAHA APNI ASLI UPI ID AUR NAAM DAALEIN
        // ==========================================
        const myUPI_ID = 'BHARATPE.9Q0Q0K0Z8Q466572@unitype'; 
        const myName = 'Sekh Sarif';

        // URL se User ki Telegram ID nikalna
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userid') || 'Unknown';

        // Plan ke mutabik kitne din ka premium dena hai
        function getDays(planName) {
            if (planName.includes('1 Days')) return 1;
            if (planName.includes('1 Month')) return 30;
            if (planName.includes('2 Months')) return 60;
            if (planName.includes('3 Months')) return 90;
            return 30; // Default
        }

        function payNow(planName, amount) {
            const days = getDays(planName);

            if (userId === 'Unknown') {
                alert("Error: User ID nahi mili. Kripya Telegram bot se portal open karein.");
                return;
            }

            // 1. Backend API ko batao ki is user ne payment click kiya hai
            fetch('/api/notify-payment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: userId, planName: planName, amount: amount, days: days })
            });

            // 2. UPI App ko direct open karne ka link (Deep link for GPay/PhonePe/Paytm)
            const transactionNote = `Payment_for_${planName.replace(/ /g, '_')}`;
            const upiLink = `upi://pay?pa=${myUPI_ID}&pn=${myName}&am=${amount}&cu=INR&tn=${transactionNote}`;
            
            // 3. User ka phone payment app open karega
            window.location.href = upiLink;

            // 4. Alert to remind them to send screenshot
            setTimeout(() => {
                alert("✅ Payment complete hone ke baad, Wapas Telegram Bot par jayen aur Payment Success ka Screenshot bhejein!");
            }, 2000);
        }
    </script>
</body>
</html>
