<script>
    const urlParams = new URLSearchParams(window.location.search);
    const userIdFromUrl = urlParams.get('userid');
    if (userIdFromUrl) {
        document.getElementById('telegramId').value = userIdFromUrl;
    } else {
        document.getElementById('telegramId').removeAttribute('readonly');
    }

    const plansData = {
        'channel1': [
            { key: 'trial', name: 'Free Trial', price: '₹0' },
            { key: '15days', name: '15 Days Trial', price: '₹99' },
            { key: '1month', name: '1 Month Pass', price: '₹199' },
            { key: '2months', name: '2 Months Pass', price: '₹369' },
            { key: '3months', name: '3 Months Gold', price: '₹499' },
            { key: '4months', name: '4 Months Diamond', price: '₹649' }
        ],
        'channel2': [
            { key: 'trial', name: 'Free Trial', price: '₹0' },
            { key: '15days', name: '15 Days Trial', price: '₹149' },
            { key: '1month', name: '1 Month Pass', price: '₹299' },
            { key: '2months', name: '2 Months Pass', price: '₹549' },
            { key: '3months', name: '3 Months Gold', price: '₹799' },
            { key: '4months', name: '4 Months Diamond', price: '₹999' }
        ]
    };

    let selectedPlanKey = null;
    const cashfree = Cashfree({ mode: "production" });

    function renderPlans() {
        const channelKey = document.getElementById('channelSelect').value;
        const container = document.getElementById('plansContainer');
        container.innerHTML = '';
        selectedPlanKey = null;

        if (!plansData[channelKey]) return;

        plansData[channelKey].forEach((plan, index) => {
            const card = document.createElement('div');
            if (index === 0) {
                card.className = 'plan-card selected';
                selectedPlanKey = plan.key;
            } else {
                card.className = 'plan-card';
            }
            
            card.innerHTML = `
                <div class="plan-name">${plan.name}</div>
                <div class="plan-price">${plan.price}</div>
            `;
            card.onclick = () => {
                document.querySelectorAll('.plan-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedPlanKey = plan.key;
            };
            container.appendChild(card);
        });
    }

    window.onload = async function() {
        renderPlans();

        // Agar user payment karke wapas redirect hoke aaya hai
        const successParam = urlParams.get('success');
        const orderIdParam = urlParams.get('order_id');
        const tId = urlParams.get('telegramId');
        const cKey = urlParams.get('channelKey');
        const pKey = urlParams.get('planKey');

        if (successParam === 'true' && orderIdParam) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('payBtn').style.display = 'none';

            try {
                const response = await fetch('/verify-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_id: orderIdParam, telegramId: tId, channelKey: cKey, planKey: pKey })
                });
                const data = await response.json();

                if (data.success) {
                    showSuccess(data.invite_link);
                } else {
                    alert(data.message || 'Payment verification failed!');
                    resetUI();
                }
            } catch (err) {
                alert('Something went wrong during verification!');
                resetUI();
            }
        }
    };

    async function processCheckout() {
        const telegramId = document.getElementById('telegramId').value.trim();
        const channelKey = document.getElementById('channelSelect').value;

        if (!telegramId) {
            alert('Please enter your Telegram User ID!');
            return;
        }
        if (!selectedPlanKey) {
            alert('Please select a plan!');
            return;
        }

        document.getElementById('loading').style.display = 'block';
        document.getElementById('payBtn').style.display = 'none';

        try {
            const response = await fetch('/create-order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ channelKey, planKey: selectedPlanKey, telegramId })
            });
            const data = await response.json();

            if (!data.success) {
                alert(data.message || 'Error creating order');
                resetUI();
                return;
            }

            if (data.isTrial) {
                const trialRes = await fetch('/activate-trial', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramId, channelKey })
                });
                const trialData = await trialRes.json();
                if (trialData.success) {
                    showSuccess(trialData.invite_link);
                } else {
                    alert(trialData.message);
                    resetUI();
                }
                return;
            }

            let checkoutOptions = {
                paymentSessionId: data.payment_session_id,
                returnUrl: window.location.href.split('?')[0] + `?success=true&order_id=${data.order_id}&telegramId=${telegramId}&channelKey=${channelKey}&planKey=${selectedPlanKey}`
            };

            cashfree.checkout(checkoutOptions).then(function(result) {
                if (result.error) {
                    alert(result.error.message);
                    resetUI();
                }
            });

        } catch (err) {
            alert('Something went wrong!');
            resetUI();
        }
    }

    function showSuccess(link) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('result-box').style.display = 'block';
        document.getElementById('inviteLink').href = link;
        document.getElementById('inviteLink').innerText = link;
    }

    function resetUI() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('payBtn').style.display = 'block';
    }
</script>
