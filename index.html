<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Portal - Subscription</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #1e293b; padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-weight: 600; font-size: 14px; }
        select, input, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: none; font-size: 16px; outline: none; box-sizing: border-box; }
        select, input[type="text"], input[type="file"] { background: #334155; color: #fff; }
        button { background: #0284c7; color: #fff; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 20px; }
        button:hover { background: #0369a1; }
        .upi-btns { display: flex; gap: 10px; margin-top: 10px; }
        .upi-btns a { flex: 1; padding: 10px; text-align: center; background: #334155; color: #38bdf8; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px; }
        .upi-btns a:hover { background: #475569; }
        .qr-box { background: #334155; padding: 15px; border-radius: 8px; text-align: center; margin-top: 15px; display: none; }
        .qr-box img { max-width: 140px; border-radius: 6px; }
        .result-box { margin-top: 20px; padding: 15px; background: #334155; border-radius: 8px; text-align: center; display: none; word-break: break-all; }
        .result-box a { color: #38bdf8; font-weight: bold; text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔥 VIP Portal</h2>
    
    <label for="channelSelect">Select Channel:</label>
    <select id="channelSelect">
        <option value="channel1">VIP Movie & Series Channel</option>
        <option value="channel2">VIP Premium Bot & Tools Channel</option>
    </select>

    <label for="planSelect">Select Plan:</label>
    <select id="planSelect" onchange="checkPlanType()">
        <option value="trial">Free Trial (10 Mins)</option>
        <option value="15days">15 Days Pass (₹99)</option>
        <option value="1month">1 Month Pass (₹199)</option>
        <option value="2months">2 Months Pass (₹369)</option>
        <option value="3months">3 Months Gold (₹499)</option>
        <option value="4months">4 Months Diamond (₹649)</option>
    </select>

    <!-- Manual Payment Section with Direct UPI apps -->
    <div id="manualSection" class="qr-box">
        <p style="margin: 0 0 10px 0; font-size: 13px; color: #38bdf8;">Payment karne ke liye kisi bhi app par click karein:</p>
        
        <div class="upi-btns">
            <a id="gpayBtn" href="#" target="_blank">Google Pay</a>
            <a id="phonepeBtn" href="#" target="_blank">PhonePe</a>
            <a id="paytmBtn" href="#" target="_blank">Paytm</a>
        </div>

        <p style="margin: 15px 0 5px 0; font-size: 13px; color: #94a3b8;">Ya QR Code scan karein:</p>
        <img id="qrImg" src="" alt="UPI QR">
        
        <label style="text-align: left;" for="utrInput">Enter UTR / Transaction ID (Payment ke baad):</label>
        <input type="text" id="utrInput" placeholder="e.g. 435214xxxxxx">

        <label style="text-align: left;" for="screenshotInput">Upload Payment Screenshot:</label>
        <input type="file" id="screenshotInput" accept="image/*">
    </div>

    <button id="actionBtn" onclick="handleSubmit()">Activate Free Trial</button>

    <div id="resultBox" class="result-box">
        <p id="resultText"></p>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const telegramId = urlParams.get('userid');
    const myUpiId = "yourupi@ybl"; // Yahan apni UPI ID daalein (Jaise merchant@paytm ya number@ybl)

    function checkPlanType() {
        const planKey = document.getElementById('planSelect').value;
        const manualSection = document.getElementById('manualSection');
        const btn = document.getElementById('actionBtn');

        if (planKey === 'trial') {
            manualSection.style.display = 'none';
            btn.innerText = 'Activate Free Trial';
        } else {
            manualSection.style.display = 'block';
            btn.innerText = 'Submit Payment Proof';

            // Prices mapping
            const prices = { '15days': 99, '1-month': 199, '1month': 199, '2months': 369, '3months': 499, '4months': 649 };
            const amount = prices[planKey] || 99;

            const upiLink = `upi://pay?pa=${myUpiId}&pn=VIPPortal&am=${amount}&cu=INR`;
            
            document.getElementById('gpayBtn').href = upiLink;
            document.getElementById('phonepeBtn').href = upiLink;
            document.getElementById('paytmBtn').href = upiLink;
            document.getElementById('qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent(upiLink)}`;
        }
    }

    async function handleSubmit() {
        if (!telegramId) {
            alert("Telegram User ID nahi mili! Kripya bot se dobara link open karein.");
            return;
        }

        const channelKey = document.getElementById('channelSelect').value;
        const planKey = document.getElementById('planSelect').value;

        if (planKey === 'trial') {
            const res = await fetch('/activate-trial', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegramId, channelKey })
            });
            const data = await res.json();
            showResult(data);
        } else {
            const utr = document.getElementById('utrInput').value;
            const screenshotFile = document.getElementById('screenshotInput').files[0];

            if (!utr) {
                alert("Kripya payment karne ke baad UTR / Transaction ID enter karein!");
                return;
            }

            const formData = new FormData();
            formData.append('telegramId', telegramId);
            formData.append('channelKey', channelKey);
            formData.append('planKey', planKey);
            formData.append('utr', utr);
            if (screenshotFile) {
                formData.append('screenshot', screenshotFile);
            }

            const res = await fetch('/submit-manual-payment', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            
            // Auto redirect to bot chat after submission
            alert("Payment details bhej di gayi hain! Ab aapko bot par redirect kiya ja raha hai.");
            window.location.href = `https://t.me/Payments_Robot_bot?start=payment_done`;
        }
    }

    function showResult(data) {
        const box = document.getElementById('resultBox');
        const text = document.getElementById('resultText');
        box.style.display = 'block';

        if (data.success) {
            if (data.invite_link) {
                text.innerHTML = `✅ Success!<br><br><a href="${data.invite_link}" target="_blank">Join Channel (Valid for 12 Hours)</a>`;
            } else {
                text.innerText = data.message;
            }
        } else {
            text.innerText = data.message || "Kuch galat ho gaya!";
        }
    }
</script>

</body>
</html>
