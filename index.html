<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Portal - Direct Payment</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #1e293b; padding: 20px; border-radius: 12px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 5px; font-size: 22px; }
        .subtitle { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        
        label { display: block; margin-top: 10px; font-weight: 600; font-size: 13px; color: #cbd5e1; }
        select { width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: none; font-size: 15px; background: #334155; color: #fff; outline: none; }

        .plan-card { background: #334155; padding: 12px 15px; border-radius: 8px; margin-top: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #475569; }
        .plan-info h4 { margin: 0; font-size: 15px; color: #f8fafc; }
        .plan-info p { margin: 3px 0 0 0; font-size: 13px; color: #38bdf8; font-weight: bold; }
        
        .pay-btn { background: #10b981; color: #fff; padding: 8px 14px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 13px; transition: background 0.2s; white-space: nowrap; }
        .pay-btn:hover { background: #059669; }
        
        .qr-section { margin-top: 20px; background: #334155; padding: 15px; border-radius: 8px; text-align: center; }
        .qr-section img { max-width: 130px; border-radius: 6px; margin-top: 5px; }

        .proof-box { margin-top: 20px; background: #1e293b; padding: 15px; border-radius: 8px; border: 1px dashed #475569; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: none; font-size: 14px; background: #334155; color: #fff; box-sizing: border-box; outline: none; }
        
        .submit-btn { width: 100%; background: #0284c7; color: #fff; padding: 12px; border-radius: 8px; border: none; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .submit-btn:hover { background: #0369a1; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔥 VIP Portal</h2>
    <div class="subtitle">Apna pasandida plan chunein aur direct pay karein</div>
    
    <label for="channelSelect">Select Channel:</label>
    <select id="channelSelect" onchange="updateLinks()">
        <option value="channel1">VIP Movie & Series Channel</option>
        <option value="channel2">VIP Premium Bot & Tools Channel</option>
    </select>

    <!-- Plans List with Direct Pay Buttons -->
    <div id="plansList"></div>

    <!-- QR Code Option -->
    <div class="qr-section">
        <p style="margin: 0; font-size: 12px; color: #94a3b8;">Ya QR Code Scan Karke Payment Karein:</p>
        <img id="qrImg" src="" alt="UPI QR">
    </div>

    <!-- Payment Proof Submission Box -->
    <div class="proof-box">
        <label for="utrInput">Enter UTR / Transaction ID (Payment ke baad):</label>
        <input type="text" id="utrInput" placeholder="e.g. 435214xxxxxx">

        <label for="screenshotInput" style="margin-top: 12px;">Upload Payment Screenshot:</label>
        <input type="file" id="screenshotInput" accept="image/*">

        <button class="submit-btn" onclick="submitProof()">Submit Proof & Get Verified</button>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const telegramId = urlParams.get('userid');
    const myUpiId = "yourupi@ybl"; // <-- Yahan apni asli UPI ID daal dena (jaise merchant@paytm)

    // Channel wise plans and prices
    const channelData = {
        'channel1': [
            { key: 'trial', name: 'Free Trial (10 Mins)', price: 0 },
            { key: '15days', name: '15 Days Pass', price: 99 },
            { key: '1month', name: '1 Month Pass', price: 199 },
            { key: '2months', name: '2 Months Pass', price: 369 },
            { key: '3months', name: '3 Months Gold', price: 499 },
            { key: '4months', name: '4 Months Diamond', price: 649 }
        ],
        'channel2': [
            { key: 'trial', name: 'Free Trial (10 Mins)', price: 0 },
            { key: '15days', name: '15 Days Pass', price: 149 },
            { key: '1month', name: '1 Month Pass', price: 299 },
            { key: '2months', name: '2 Months Pass', price: 549 },
            { key: '3months', name: '3 Months Gold', price: 799 },
            { key: '4months', name: '4 Months Diamond', price: 999 }
        ]
    };

    let selectedPlanKey = '15days'; // Default

    function updateLinks() {
        const channelKey = document.getElementById('channelSelect').value;
        const plans = channelData[channelKey];
        const plansListDiv = document.getElementById('plansList');
        plansListDiv.innerHTML = '';

        plans.forEach(plan => {
            const upiLink = plan.price === 0 ? '#' : `upi://pay?pa=${myUpiId}&pn=VIPPortal&am=${plan.price}&cu=INR`;
            
            const card = document.createElement('div');
            card.className = 'plan-card';
            
            let actionBtnHtml = '';
            if (plan.price === 0) {
                actionBtnHtml = `<button class="pay-btn" style="background:#0284c7;" onclick="selectTrial('${plan.key}')">Active Trial</button>`;
            } else {
                actionBtnHtml = `<a class="pay-btn" href="${upiLink}" onclick="setPlan('${plan.key}')" target="_blank">Pay ₹${plan.price}</a>`;
            }

            card.innerHTML = `
                <div class="plan-info">
                    <h4>${plan.name}</h4>
                    <p>${plan.price === 0 ? 'FREE' : '₹' + plan.price}</p>
                </div>
                ${actionBtnHtml}
            `;
            plansListDiv.appendChild(card);
        });

        // Default QR for first paid plan
        updateQR(channelKey, '15days');
    }

    function setPlan(planKey) {
        selectedPlanKey = planKey;
        const channelKey = document.getElementById('channelSelect').value;
        updateQR(channelKey, planKey);
    }

    function updateQR(channelKey, planKey) {
        const plans = channelData[channelKey];
        const currentPlan = plans.find(p => p.key === planKey);
        if (currentPlan && currentPlan.price > 0) {
            const upiLink = `upi://pay?pa=${myUpiId}&pn=VIPPortal&am=${currentPlan.price}&cu=INR`;
            document.getElementById('qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=${encodeURIComponent(upiLink)}`;
        }
    }

    async function selectTrial(planKey) {
        if (!telegramId) {
            alert("Telegram User ID nahi mili! Bot se link dobara open karein.");
            return;
        }
        const channelKey = document.getElementById('channelSelect').value;
        const res = await fetch('/activate-trial', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ telegramId, channelKey })
        });
        const data = await res.json();
        if (data.success) {
            alert("Free Trial Activated! Bot par link bhej diya gaya hai.");
            window.location.href = `https://t.me/Payments_Robot_bot?start=payment_done`;
        } else {
            alert(data.message);
        }
    }

    async function submitProof() {
        if (!telegramId) {
            alert("Telegram User ID nahi mili!");
            return;
        }

        const utr = document.getElementById('utrInput').value;
        const screenshotFile = document.getElementById('screenshotInput').files[0];
        const channelKey = document.getElementById('channelSelect').value;

        if (!utr) {
            alert("Kripya payment karne ke baad UTR / Transaction ID enter karein!");
            return;
        }

        const formData = new FormData();
        formData.append('telegramId', telegramId);
        formData.append('channelKey', channelKey);
        formData.append('planKey', selectedPlanKey);
        formData.append('utr', utr);
        if (screenshotFile) {
            formData.append('screenshot', screenshotFile);
        }

        try {
            const res = await fetch('/submit-manual-payment', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            if (data.success) {
                alert("Payment details bhej di gayi hain! Ab aapko bot par redirect kiya ja raha hai.");
                window.location.href = `https://t.me/Payments_Robot_bot?start=payment_done`;
            } else {
                alert(data.message || "Error!");
            }
        } catch (err) {
            alert("Server Error! Dobara koshish karein.");
        }
    }

    // Load initial list
    updateLinks();
</script>

</body>
</html>
