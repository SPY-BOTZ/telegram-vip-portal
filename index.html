<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Membership Portal - Secure Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0b0f19] text-slate-100 font-sans min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-md w-full bg-[#131b2e] border border-slate-700/60 rounded-2xl p-8 shadow-2xl">
        <h2 class="text-2xl font-bold mb-2 text-center">VIP Pass Checkout</h2>
        <p class="text-xs text-slate-400 text-center mb-6">Make a real payment via UPI/Cards to get instant automated Telegram access.</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase mb-1 text-slate-300">Select Plan</label>
                <select id="planSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white">
                    <option value="199">Silver Pass - ₹199</option>
                    <option value="499" selected>Gold VIP - ₹499</option>
                    <option value="999">Diamond VIP - ₹999</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase mb-1 text-slate-300">Telegram Numeric User ID</label>
                <input type="text" id="telegramId" placeholder="e.g. 123456789" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white">
            </div>
            <button onclick="startPayment()" class="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-black font-bold transition">
                Pay Now Securely
            </button>
        </div>
    </div>

    <script>
        async function startPayment() {
            const amount = document.getElementById('planSelect').value;
            const telegramId = document.getElementById('telegramId').value.trim();

            if(!telegramId) {
                alert('Please enter your Telegram User ID!');
                return;
            }

            // 1. Create order from backend
            const response = await fetch('/create-order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount })
            });
            const data = await response.json();

            if(!data.success) {
                alert('Could not initiate payment.');
                return;
            }

            // 2. Open Razorpay Checkout Modal
            const options = {
                "key": "YOUR_RAZORPAY_KEY_ID", // Yahan apni Razorpay Key ID dalein
                "amount": data.order.amount,
                "currency": "INR",
                "name": "VIP Telegram Vault",
                "description": "Subscription Access",
                "order_id": data.order.id,
                "handler": async function (response) {
                    // 3. Verify payment on backend after success
                    const verifyRes = await fetch('/verify-payment', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            razorpay_order_id: response.razorpay_order_id,
                            razorpay_payment_id: response.razorpay_payment_id,
                            razorpay_signature: response.razorpay_signature,
                            telegramId: telegramId
                        })
                    });
                    const verifyData = await verifyRes.json();
                    if(verifyData.success) {
                        alert('Payment Successful! Check your Telegram messages for the VIP invite link.');
                        window.location.href = verifyData.invite_link;
                    } else {
                        alert('Payment verification failed.');
                    }
                },
                "theme": { "color": "#f59e0b" }
            };
            const rzp = new Razorpay(options);
            rzp.open();
        }
    </script>
</body>
</html>
