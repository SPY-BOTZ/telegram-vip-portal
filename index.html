<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Membership Portal - Select Plan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0b0f19] text-slate-100 font-sans min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-md w-full bg-[#131b2e] border border-slate-700/60 rounded-2xl p-8 shadow-2xl">
        <h2 class="text-2xl font-bold mb-2 text-center text-amber-400"><i class="fa-solid fa-crown mr-2"></i>VIP Pass Portal</h2>
        <p class="text-xs text-slate-400 text-center mb-6">Choose your duration, pay securely, and get instant access to our private channel.</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase mb-1 text-slate-300">Select Subscription Duration</label>
                <select id="monthSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-amber-400">
                    <option value="1">1 Month - ₹199</option>
                    <option value="2">2 Months - ₹398</option>
                    <option value="3" selected>3 Months - ₹597 (Popular)</option>
                    <option value="4">4 Months - ₹796</option>
                    <option value="5">5 Months - ₹899 (Best Value)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase mb-1 text-slate-300">Telegram Numeric User ID</label>
                <input type="text" id="telegramId" placeholder="e.g. 123456789" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-amber-400">
            </div>
            <button onclick="startPayment()" class="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-black font-bold transition shadow-lg shadow-amber-500/20">
                Proceed to Secure Payment
            </button>
        </div>
    </div>

    <script>
        async function startPayment() {
            const months = document.getElementById('monthSelect').value;
            const telegramId = document.getElementById('telegramId').value.trim();

            if(!telegramId) {
                alert('Please enter your Telegram User ID!');
                return;
            }

            // 1. Create order from backend
            const response = await fetch('/create-order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ months })
            });
            const data = await response.json();

            if(!data.success) {
                alert('Could not initiate payment.');
                return;
            }

            // 2. Open Razorpay Checkout Modal
            const options = {
                "key": "YOUR_RAZORPAY_KEY_ID", // Yahan apni live ya test Razorpay Key ID dalein
                "amount": data.order.amount,
                "currency": "INR",
                "name": "VIP Telegram Channel",
                "description": `${data.months} Month(s) Membership Access`,
                "order_id": data.order.id,
                "handler": async function (response) {
                    // 3. Verify payment on backend
                    const verifyRes = await fetch('/verify-payment', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            razor_order_id: response.razorpay_order_id,
                            razorpay_order_id: response.razorpay_order_id,
                            razorpay_payment_id: response.razorpay_payment_id,
                            razorpay_signature: response.razorpay_signature,
                            telegramId: telegramId,
                            months: data.months
                        })
                    });
                    const verifyData = await verifyRes.json();
                    if(verifyData.success) {
                        alert('Payment Successful! Check your Telegram messages for the VIP private invite link.');
                        window.location.href = verifyData.invite_link;
                    } else {
                        alert('Payment verification failed.');
                    }
                },
                "theme": { "color": "#f59e0b" }
            };
            const rzp = new Razorpay(options);
            rzp.open();
        }
    </script>
</body>
</html>
