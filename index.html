<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-VIP | Secure Access Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .neon-glow {
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.25);
        }
        .cyber-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 font-sans min-h-screen flex flex-col items-center justify-center p-4 selection:bg-cyan-500 selection:text-black">

    <div class="max-w-xl w-full cyber-card rounded-3xl p-6 md:p-10 neon-glow relative overflow-hidden">
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-cyan-600/20 rounded-full blur-3xl pointer-events-none"></div>

        <div class="text-center mb-8 relative z-10">
            <span class="px-3 py-1 text-[10px] font-extrabold uppercase tracking-widest bg-cyan-500/10 text-cyan-400 rounded-full border border-cyan-500/20">
                <i class="fa-solid fa-bolt mr-1"></i> Quantum Encrypted Portal
            </span>
            <h1 class="text-3xl md:text-4xl font-black mt-3 tracking-tight bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500 bg-clip-text text-transparent">
                VIP Access Terminal
            </h1>
            <p class="text-xs md:text-sm text-slate-400 mt-2">Select your duration, input your Telegram ID, and initiate instant neural-link deployment.</p>
        </div>

        <div class="space-y-6 relative z-10">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-cyan-400 mb-2">
                    <i class="fa-brands fa-telegram mr-1"></i> Telegram Numeric User ID
                </label>
                <input type="text" id="telegramId" placeholder="e.g. 123456789" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl p-4 text-sm text-white focus:outline-none focus:border-cyan-400 transition shadow-inner">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-cyan-400 mb-3">Choose Duration Tier</label>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    
                    <button onclick="selectPlan('15days', this)" data-plan="15days" class="plan-btn p-4 rounded-xl border border-slate-700/80 bg-slate-900/50 hover:border-cyan-400 text-left transition flex justify-between items-center group">
                        <div>
                            <div class="text-xs font-semibold text-slate-400">15 Days</div>
                            <div class="text-base font-bold text-white group-hover:text-cyan-300">Trial Pass</div>
                        </div>
                        <span class="text-cyan-400 font-extrabold text-lg">₹99</span>
                    </button>

                    <button onclick="selectPlan('1month', this)" data-plan="1-month" class="plan-btn p-4 rounded-xl border border-slate-700/80 bg-slate-900/50 hover:border-purple-400 text-left transition flex justify-between items-center group">
                        <div>
                            <div class="text-xs font-semibold text-slate-400">1 Month</div>
                            <div class="text-base font-bold text-white group-hover:text-purple-300">Standard</div>
                        </div>
                        <span class="text-purple-400 font-extrabold text-lg">₹199</span>
                    </button>

                    <button onclick="selectPlan('2months', this)" data-plan="2-months" class="plan-btn p-4 rounded-xl border border-slate-700/80 bg-slate-900/50 hover:border-blue-400 text-left transition flex justify-between items-center group">
                        <div>
                            <div class="text-xs font-semibold text-slate-400">2 Months</div>
                            <div class="text-base font-bold text-white group-hover:text-blue-300">Extended</div>
                        </div>
                        <span class="text-blue-400 font-extrabold text-lg">₹369</span>
                    </button>

                    <button onclick="selectPlan('3months', this)" data-plan="3-months" class="plan-btn p-4 rounded-xl border border-amber-500/80 bg-slate-900/80 hover:border-amber-400 text-left transition flex justify-between items-center group shadow-lg shadow-amber-500/10 ring-1 ring-amber-500/30">
                        <div>
                            <div class="text-[10px] uppercase font-bold text-amber-400">Most Popular</div>
                            <div class="text-base font-bold text-white group-hover:text-amber-300">3 Months VIP</div>
                        </div>
                        <span class="text-amber-400 font-extrabold text-lg">₹499</span>
                    </button>

                </div>

                <button onclick="selectPlan('4months', this)" data-plan="4-months" class="plan-btn w-full mt-3 p-4 rounded-xl border border-pink-500/80 bg-slate-900/80 hover:border-pink-400 text-left transition flex justify-between items-center group shadow-lg shadow-pink-500/10 ring-1 ring-pink-500/30">
                    <div>
                        <div class="text-[10px] uppercase font-bold text-pink-400">Ultimate Bundle</div>
                        <div class="text-base font-bold text-white group-hover:text-pink-300">4 Months Diamond Pass</div>
                    </div>
                    <span class="text-pink-400 font-extrabold text-lg">₹649</span>
                </button>
            </div>

            <button onclick="initiatePayment()" class="w-full py-4 rounded-xl bg-gradient-to-r from-cyan-500 via-purple-600 to-pink-600 hover:opacity-95 text-white font-extrabold tracking-wider uppercase transition shadow-xl shadow-purple-600/35 text-sm">
                <i class="fa-solid fa-shield-halved mr-2"></i> Initialize Secure Checkout
            </button>
        </div>
    </div>

    <script>
        let selectedPlanKey = '3months'; // Default selected

        // Highlight selected button UI
        function selectPlan(key, btnElement) {
            selectedPlanKey = key;
            document.querySelectorAll('.plan-btn').forEach(b => {
                b.classList.remove('ring-2', 'ring-cyan-400', 'border-cyan-400');
            });
            btnElement.classList.add('ring-2', 'ring-cyan-400', 'border-cyan-400');
        }

        // Set default initial highlight on 3months
        document.addEventListener("DOMContentLoaded", () => {
            const defaultBtn = document.querySelector("[onclick*='3months']");
            if(defaultBtn) defaultBtn.classList.add('ring-2', 'ring-cyan-400', 'border-cyan-400');
        });

        async function initiatePayment() {
            const telegramId = document.getElementById('telegramId').value.trim();

            if(!telegramId) {
                alert('⚠️ Please enter your Telegram Numeric User ID first!');
                return;
            }

            // 1. Create order
            const res = await fetch('/create-order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ planKey: selectedPlanKey })
            });
            const data = await res.json();

            if(!data.success) {
                alert('Transaction initialization failed.');
                return;
            }

            // 2. Razorpay Modal Configuration
            const options = {
                "key": "YOUR_RAZORPAY_KEY_ID", // Apni live ya test key yahan dalein
                "amount": data.order.amount,
                "currency": "INR",
                "name": "CYBER-VIP SECUREVAULT",
                "description": data.plan.name,
                "order_id": data.order.id,
                "handler": async function (response) {
                    // 3. Verify Payment
                    const verifyRes = await fetch('/verify-payment', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            razorpay_order_id: response.razorpay_order_id,
                            razorpay_payment_id: response.razorpay_payment_id,
                            razorpay_signature: response.razorpay_signature,
                            telegramId: telegramId,
                            planKey: selectedPlanKey
                        })
                    });
                    const verifyData = await verifyRes.json();
                    if(verifyData.success) {
                        alert('✨ Payment Verified Successfully! Check your Telegram inbox for the private channel link.');
                        window.location.href = verifyData.invite_link;
                    } else {
                        alert('❌ Payment cryptographic verification failed.');
                    }
                },
                "theme": { "color": "#06b6d4" }
            };
            const rzp = new Razorpay(options);
            rzp.open();
        }
    </script>
</body>
</html>
