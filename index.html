<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-VIP | Multi-Channel Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .neon-glow { box-shadow: 0 0 35px rgba(139, 92, 246, 0.2); }
        .cyber-card { background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full cyber-card rounded-3xl p-6 md:p-8 neon-glow relative overflow-hidden">
        <div class="text-center mb-5 relative z-10">
            <div class="text-[10px] font-bold uppercase tracking-widest text-cyan-400 mb-1">⚡ Automatic Channel Access</div>
            <h1 class="text-2xl md:text-3xl font-black tracking-tight bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500 bg-clip-text text-transparent">
                VIP Membership Portal
            </h1>
            <p class="text-xs text-slate-400 mt-1">Choose channel, duration and get instant access.</p>
        </div>

        <div class="space-y-4 relative z-10">
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-cyan-400 mb-1.5"><i class="fa-solid fa-tv mr-1"></i> Select VIP Channel</label>
                <select id="channelSelect" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400 transition">
                    <option value="channel1">🎬 Channel 1: VIP Movie & Series</option>
                    <option value="channel2">🤖 Channel 2: Premium Bot & Tools</option>
                </select>
            </div>

            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-cyan-400 mb-1.5"><i class="fa-brands fa-telegram mr-1"></i> Telegram Numeric User ID</label>
                <input type="text" id="telegramId" placeholder="e.g. 123456789" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400 transition">
            </div>

            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-cyan-400 mb-2">Select Duration Plan</label>
                <button onclick="selectPlan('trial', this)" data-plan="trial" class="plan-btn w-full mb-2.5 p-3 rounded-xl border border-emerald-500/80 bg-slate-900/80 text-left transition flex justify-between items-center">
                    <div>
                        <span class="text-[9px] font-extrabold uppercase text-emerald-400 block">✨ Special Offer</span>
                        <span class="text-sm font-bold text-white">10 Mins Free Trial</span>
                    </div>
                    <span class="text-emerald-400 font-extrabold text-base">FREE</span>
                </button>

                <div class="grid grid-cols-2 gap-2.5">
                    <button onclick="selectPlan('15days', this)" data-plan="15days" class="plan-btn p-3 rounded-xl border border-slate-700/80 bg-slate-900/60 text-left transition flex flex-col justify-between">
                        <span class="text-[11px] font-semibold text-slate-400">15 Days</span>
                        <div class="flex justify-between items-end mt-1"><span class="text-sm font-bold text-white">Trial</span><span class="text-cyan-400 font-extrabold text-base">₹99</span></div>
                    </button>
                    <button onclick="selectPlan('1month', this)" data-plan="1month" class="plan-btn p-3 rounded-xl border border-slate-700/80 bg-slate-900/60 text-left transition flex flex-col justify-between">
                        <span class="text-[11px] font-semibold text-slate-400">1 Month</span>
                        <div class="flex justify-between items-end mt-1"><span class="text-sm font-bold text-white">Standard</span><span class="text-purple-400 font-extrabold text-base">₹199</span></div>
                    </button>
                    <button onclick="selectPlan('2months', this)" data-plan="2months" class="plan-btn p-3 rounded-xl border border-slate-700/80 bg-slate-900/60 text-left transition flex flex-col justify-between">
                        <span class="text-[11px] font-semibold text-slate-400">2 Months</span>
                        <div class="flex justify-between items-end mt-1"><span class="text-sm font-bold text-white">Extended</span><span class="text-blue-400 font-extrabold text-base">₹369</span></div>
                    </button>
                    <button onclick="selectPlan('3months', this)" data-plan="3months" class="plan-btn p-3 rounded-xl border border-amber-500/80 bg-slate-900/80 text-left transition flex flex-col justify-between">
                        <span class="text-[9px] font-extrabold uppercase text-amber-400">🔥 Popular</span>
                        <div class="flex justify-between items-end mt-0.5"><span class="text-sm font-bold text-white">3 Months</span><span class="text-amber-400 font-extrabold text-base">₹499</span></div>
                    </button>
                </div>
            </div>

            <button onclick="handleAction()" id="actionBtn" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 via-purple-600 to-pink-600 text-white font-black tracking-wider uppercase transition text-xs shadow-lg">
                <i class="fa-solid fa-lock mr-2"></i> Proceed to Secure Payment
            </button>
        </div>
    </div>

    <script>
        const cashfree = Cashfree({ mode: "production" });
        let selectedPlanKey = '3months';

        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const userIdFromUrl = urlParams.get('userid') || urlParams.get('id');
            if(userIdFromUrl) {
                document.getElementById('telegramId').value = userIdFromUrl;
            }
        });

        function selectPlan(key, btnElement) {
            selectedPlanKey = key;
            document.querySelectorAll('.plan-btn').forEach(b => {
                b.classList.remove('ring-2', 'ring-cyan-400', 'border-cyan-400', 'bg-slate-800');
            });
            btnElement.classList.add('ring-2', 'ring-cyan-400', 'border-cyan-400', 'bg-slate-800');
        }

        async function handleAction() {
            const channelKey = document.getElementById('channelSelect').value;
            const telegramId = document.getElementById('telegramId').value.trim();

            if(!telegramId) {
                alert('⚠️ Telegram User ID nahi mili!');
                return;
            }

            const res = await fetch('/create-order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ channelKey, planKey: selectedPlanKey, telegramId })
            });
            const data = await res.json();

            if(!data.success) {
                alert('❌ Error: ' + (data.message || 'Action failed'));
                return;
            }

            if(data.isTrial) {
                const trialRes = await fetch('/activate-trial', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramId, channelKey })
                });
                const trialData = await trialRes.json();
                if(trialData.success) {
                    alert('🎉 Free Trial Activated!');
                    window.location.href = trialData.invite_link;
                } else {
                    alert('❌ ' + trialData.message);
                }
                return;
            }

            cashfree.checkout({ paymentSessionId: data.payment_session_id, redirectTarget: "_modal" }).then(async function(result) {
                if(result.payment) {
                    const verifyRes = await fetch('/verify-payment', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ order_id: data.order_id, telegramId, channelKey, planKey: selectedPlanKey })
                    });
                    const verifyData = await verifyRes.json();
                    if(verifyData.success) {
                        alert('✨ Payment Successful!');
                        window.location.href = verifyData.invite_link;
                    }
                }
            });
        }
    </script>
</body>
</html>
